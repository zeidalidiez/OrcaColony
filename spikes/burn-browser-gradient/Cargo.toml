[package]
name = "orcacolony-burn-browser-gradient"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std", "autodiff", "webgpu"] }
burn-store = { version = "0.21.0", default-features = false, features = ["std", "safetensors"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
safetensors = "0.7.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[profile.release]
lto = "thin"
opt-level = 3
