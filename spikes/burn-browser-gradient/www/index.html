<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrcaColony Burn WebGPU gradient spike</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    body { max-width: 900px; margin: 3rem auto; padding: 0 1.25rem; background: #0b1220; color: #dbeafe; }
    h1 { color: #7dd3fc; }
    button { border: 0; border-radius: .5rem; padding: .8rem 1.1rem; background: #0284c7; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    pre { min-height: 12rem; padding: 1rem; overflow: auto; border: 1px solid #334155; border-radius: .5rem; background: #020617; white-space: pre-wrap; }
    .note { color: #94a3b8; }
  </style>
</head>
<body>
  <h1>OrcaColony Burn/WebGPU gradient spike</h1>
  <p>Loads the exact M0 T0 checkpoint and batch, runs summed causal-LM backward in browser WebGPU, exports every FP32 gradient, and compares it with the Python oracle.</p>
  <button id="run">Run T0 backward pass</button>
  <p class="note">The first run compiles WebGPU kernels and can take a while.</p>
  <pre id="output">Ready.</pre>
  <script type="module" src="./index.js"></script>
</body>
</html>
