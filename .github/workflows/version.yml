name: Version policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check every pull request commit
        if: github.event_name == 'pull_request'
        run: python scripts/check_version.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Check every pushed commit
        if: github.event_name == 'push'
        run: python scripts/check_version.py --base-ref "${{ github.event.before }}"
