[project]
name = "orcacolony"
version = "0.1.9"
description = "Volunteer model training framework"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "huggingface-hub>=1,<2",
  "numpy>=1.26,<3",
  "safetensors>=0.5,<1",
  "tokenizers>=0.21,<0.23",
  "torch>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcacolony"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
